# PostgreSQL certificate identity — TLS-only HBA (sentin8 group DESIGN.md
# §3.2). hostssl + `cert` ONLY: no plaintext `host` line exists, the client
# certificate authenticates every TCP connection, and no password is ever
# checked. The `pgm` identity map resolves the connecting role from the
# client cert's CN (see postgres-pg-ident.conf — rows are appended at
# enrollment, never hardcoded).
#
# The container-local unix-socket `trust` line keeps in-container operator
# shells and health probes working; it is not reachable from outside the
# PostgreSQL host.

# TYPE    DATABASE  USER  ADDRESS         METHOD
local     all       all                   trust
hostssl  all       all   127.0.0.1/32    cert map=pgm clientcert=verify-full
hostssl  all       all   ::1/128         cert map=pgm clientcert=verify-full
hostssl  all       all   all             cert map=pgm clientcert=verify-full