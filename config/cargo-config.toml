# Cargo config template — points at the sentin8-dev vendored local-registry.
# Verticals copy this to their .cargo/config.toml to resolve sentin8-* crates
# from /usr/share/sentin8/registry without the sentin8 source repo or network.
#
# See sentin8/design/sentin8-debian-packaging-design.md §5.2.

[source.crates-io]
replace-with = "sentin8"

[source.sentin8]
local-registry = "/usr/share/sentin8/registry"