# PostgreSQL certificate identity map (sentin8 group DESIGN.md §3.2).
#
# One map (`pgm`): SYSTEM-USERNAME is the client certificate's CN,
# PG-USERNAME is the connecting role. Rows are written by `make infra-tls`
# (the fixed operator mapping below) and `sentin8-cli vertical enroll`
# (every service's declared roles — registration-driven; zero core
# vertical knowledge, no per-service lines live in this file).
# PostgreSQL re-reads this file per connection — rows apply without a
# server restart. An unmapped CN authenticates as nothing (fail closed).

# MAPNAME  SYSTEM-USERNAME      PG-USERNAME
pgm        m2m-postgres-ops     sentin8